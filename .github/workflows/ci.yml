name: CI

# Corre en cada pull request y en cada push a main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  verificar:
    name: Lint, tipos, pruebas, build y e2e
    # Versión fija: ubuntu-latest ya apunta a 26.04, que Playwright 1.59 todavía no soporta.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # El formulario de contacto valida y verifica Turnstile, pero no llama a Resend.
      CONTACT_DRY_RUN: '1'
      # Claves de prueba de Cloudflare Turnstile (siempre aprueban).
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      RESEND_API_KEY: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tipos
        run: npm run typecheck

      - name: Pruebas unitarias
        run: npm run test

      - name: Build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas e2e (mobile y desktop)
        run: npx playwright test

      - name: Guardar el informe de Playwright si algo falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
